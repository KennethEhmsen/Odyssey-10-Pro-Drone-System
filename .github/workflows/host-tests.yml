# =====================================================================================
#  Host verification tests
#  ------------------------------------------------------------------------------------
#  COST
#
#  This repository is PUBLIC, so GitHub-hosted standard runners are FREE AND UNLIMITED.
#  There is no quota to exhaust and no billing to configure. That is why the repository
#  was made public: on a private repo the first run came back "The job was not started
#  because recent account payments have failed or your spending limit needs to be
#  increased", and the only ways forward were to authorise spending or to go public.
#
#  The controls below are kept anyway. They cost nothing to keep, they keep runs fast,
#  and they mean this workflow stays cheap if the repository is ever made private again:
#
#    * ubuntu-latest only. Linux consumes minutes at 1x; Windows is 2x and macOS 10x.
#      Never add those runners to this workflow.
#    * No `schedule:` trigger. Cron burns minutes even when nothing has changed.
#    * Path filters. Note that docs/ and hardware/ ARE included: the consistency
#      check compares the specification and the BOM against the firmware, so a
#      documentation edit genuinely can break the build.
#    * concurrency + cancel-in-progress, so a burst of pushes runs once, not N times.
#    * One job, no matrix.
#    * fetch-depth 1, and no toolchain install -- g++ is preinstalled on the runner.
#    * timeout-minutes as a hard backstop against a hung job draining the quota.
#
#  The tests build and run in well under 30 seconds.
#
#  The pre-push hook runs the same checks locally before every push, so CI is the
#  backstop for anything pushed with --no-verify rather than the only line of defence:
#      git config core.hooksPath tools/git-hooks
# =====================================================================================

name: host-tests

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'shared/**'
      - 'tools/**'
      - 'hardware/**'
      - 'docs/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'shared/**'
      - 'tools/**'
      - 'hardware/**'
      - 'docs/**'
      - '.github/workflows/host-tests.yml'

  # Manual trigger, for running against an unchanged tree.
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A second push to the same branch cancels the first run rather than paying for both.
concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify safety-critical algorithms
    runs-on: ubuntu-latest      # 1x minute multiplier -- do not change
    timeout-minutes: 5          # backstop; the real runtime is seconds

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1        # no history needed, and it is faster

      - name: Compiler version
        run: g++ --version

      # Warnings are escalated to errors here but NOT in run_tests.sh, so a new
      # compiler release introducing a new diagnostic breaks CI rather than blocking
      # everyone's local runs. The -Wcomment class in particular matters: a `//`
      # comment ending in a backslash silently swallows the following line, which is
      # exactly the sort of latent trap this project exists to avoid.
      # Catches the class of defect that dominated this project's review: the
      # specification and the firmware silently disagreeing with each other.
      - name: Project consistency
        run: python3 tools/check_consistency.py

      - name: Build and run host tests
        env:
          EXTRA_CXXFLAGS: -Werror
        run: sh tools/host_tests/run_tests.sh

      # Guards the cost properties above against a well-meaning future edit.
      - name: Assert the workflow stays cheap
        if: always()
        run: |
          set -e
          f=.github/workflows/host-tests.yml
          if grep -qE 'runs-on:.*(windows|macos)' "$f"; then
            echo "::error file=$f::Windows (2x) or macOS (10x) runner added -- this workflow must stay Linux-only"
            exit 1
          fi
          if grep -qE '^\s*schedule:' "$f"; then
            echo "::error file=$f::A schedule trigger burns quota with no change to test"
            exit 1
          fi
          if grep -qE '^\s*strategy:' "$f"; then
            echo "::error file=$f::A build matrix multiplies the minute cost"
            exit 1
          fi
          echo "Cost guards intact: Linux-only, no schedule, no matrix."
