; =====================================================================================
;  Odyssey-10 Pro -- Emergency Locator Beacon (ESP32-C3)
; =====================================================================================
[env:odyssey-beacon]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200

build_flags =
    -I ../../shared
    -std=gnu++17
    -Wall
    -Wextra
    ; Deep/light sleep needs the RTC slow memory retained across the power handover
    ; from the aircraft 5 V rail to the 1S cell.
    -DCONFIG_ESP32C3_RTCDATA_IN_FAST_MEM=1

build_unflags = -std=gnu++11

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
