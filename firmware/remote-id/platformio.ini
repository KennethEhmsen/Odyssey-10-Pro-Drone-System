; =====================================================================================
;  Odyssey-10 Pro -- Direct Remote ID broadcaster (ESP32-C6)
;
;  The ESP32-P4 has no radio of any kind, so Remote ID cannot live on the flight
;  controller. This module carries BLE 5 Long Range and Wi-Fi.
; =====================================================================================
[env:odyssey-remoteid]
platform      = espressif32
board         = esp32-c6-devkitc-1
framework     = arduino
monitor_speed = 115200

build_flags =
    -I ../../shared
    -std=gnu++17
    -Wall
    -Wextra

build_unflags = -std=gnu++11

lib_deps =
    ; The ASTM F3411 bit layout is easy to get subtly wrong. Link the reference
    ; encoder rather than hand-rolling it.
    https://github.com/opendroneid/opendroneid-core-c.git#v2.0
