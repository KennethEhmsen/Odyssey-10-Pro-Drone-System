; =====================================================================================
;  Odyssey-10 Pro -- Flight Controller (ESP32-P4)
; =====================================================================================
[env:odyssey-fc]
platform         = espressif32
board            = esp32-p4-function-ev-board
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600

build_flags =
    -I include
    -I ../../shared
    -std=gnu++17
    -Wall
    -Wextra
    -Werror=return-type
    ; Treat a float/int mix in a control expression as an error. Finding 1 was a units
    ; mistake; this class of check is cheap insurance against the next one.
    -Wfloat-conversion
    -DCORE_DEBUG_LEVEL=1

build_unflags = -std=gnu++11

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    mikalhart/TinyGPSPlus @ ^1.0.3
    sandeepmistry/LoRa @ ^0.8.0

check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance --inline-suppr
